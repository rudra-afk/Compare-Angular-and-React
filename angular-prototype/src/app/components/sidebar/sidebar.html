<aside class="sidebar">
  <div class="brand">
    <span class="brand-mark">TF</span>
    <span class="brand-name">TaskFlow</span>
  </div>
  <nav class="nav">
    <a
      class="link"
      routerLink="/"
      routerLinkActive="link-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.8" />
        <rect x="13" y="3" width="8" height="5" rx="2" stroke="currentColor" stroke-width="1.8" />
        <rect x="13" y="10" width="8" height="11" rx="2" stroke="currentColor" stroke-width="1.8" />
        <rect x="3" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.8" />
      </svg>
      Dashboard
    </a>
    <a class="link" routerLink="/projects" routerLinkActive="link-active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </svg>
      Projects
    </a>
  </nav>
  <div class="footer">
    <label class="toggle">
      <input type="checkbox" [checked]="failuresEnabled()" (change)="toggleFailures()" />
      <span>Simulate API failures</span>
    </label>
    <p class="hint">Angular prototype · TaskFlow</p>
  </div>
</aside>
