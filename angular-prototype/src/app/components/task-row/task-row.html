<div class="row">
  <div class="main">
    <p class="title">{{ task.title }}</p>
    @if (task.description) {
      <p class="description">{{ task.description }}</p>
    }
  </div>
  <div class="badges">
    <app-status-badge [status]="task.status" />
    <app-priority-badge [priority]="task.priority" />
  </div>
  <div class="due" [class.overdue]="overdue">
    @if (overdue) {
      <span class="overdue-label">Overdue</span>
    }
    <span>{{ formatDate(task.dueDate) }}</span>
  </div>
  <div class="actions">
    <a class="btn btn-ghost" [routerLink]="['/projects', projectId, 'tasks', task.id, 'edit']">Edit</a>
    <button type="button" class="btn btn-ghost" (click)="delete.emit(task)">Delete</button>
  </div>
</div>
