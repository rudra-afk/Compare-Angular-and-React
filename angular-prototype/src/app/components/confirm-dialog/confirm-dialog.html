@if (open) {
  <div class="overlay" role="presentation" (click)="cancel.emit()">
    <div
      class="dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
      aria-describedby="confirm-dialog-message"
      (click)="$event.stopPropagation()"
    >
      <h2 id="confirm-dialog-title" class="title">{{ title }}</h2>
      <p id="confirm-dialog-message" class="message">{{ message }}</p>
      @if (errorMessage) {
        <p class="error-message">{{ errorMessage }}</p>
      }
      <div class="actions">
        <button
          #cancelBtn
          type="button"
          class="btn btn-secondary"
          (click)="cancel.emit()"
          [disabled]="loading"
        >
          {{ cancelLabel }}
        </button>
        <button
          type="button"
          [class]="'btn ' + (variant === 'danger' ? 'btn-danger' : 'btn-primary')"
          (click)="confirm.emit()"
          [disabled]="loading"
        >
          {{ loading ? 'Working…' : confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
